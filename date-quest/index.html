<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Let's Plan a Date</title>
  <meta name="description" content="A very official, very scientific date-planning quiz 💌" />
  <meta property="og:title" content="You've got a date to plan 💌" />
  <meta property="og:description" content="A very official, very scientific date-planning quiz." />
  <meta name="theme-color" content="#fbf6f3" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="shell">
    <div class="topbar" id="topbar" hidden>
      <button class="back" id="back" aria-label="Previous question">←</button>
      <div class="track" aria-hidden="true"><div class="fill" id="fill"></div></div>
      <span class="count" id="count"></span>
    </div>
    <section class="card" id="screen" aria-live="polite"></section>
  </main>
  <script src="script.js"></script>
</body>
</html>
